[model]
model_type = 'ConnectomeModel'
dynamics_type = 'CurrentDynamics'
device = "cpu"
dtype = "float32"
use_layer_norm = true
nonlinearity = "Softplus"
dt = 0.01
synapse_count_threshold = 2
use_connectome_subset = [
    'L2', 'L4', 'Tm1', 'Tm2', 'Tm4', 'Tm9', 'T5a', 'T5b', 'T5c', 'T5d',
    'L1', 'L3', 'L5', 'Mi1', 'Tm3', 'Mi4', 'Mi9', 'C2', 'C3', 'T4a', 'T4b', 'T4c' ,'T4d'
]

[model.regions.optic_lobe]
side                = 'right'
use_input_conv      = true
conv_size_x         = 7
input_pre_conv_size = 5
num_temporal_modes  = 4
readouts            = ['FlowConv2Readout']

[training]
num_steps = 100
save_every = 10
input_noise_std = 0.16
contrast_std = 0.2
loss_components = ['flow_loss']
alpha = 0.01
clip_norm = 'none'

[stimulus]
stimulus_type = 'random_sine'

# No [data] table: tests/model_factory.py takes [data].data_folder from the
# repo-root config.toml (or the default).
