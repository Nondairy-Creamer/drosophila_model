[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drosophila-model"
version = "0.1.0"
description = "Drosophila connectome-based recurrent neural models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "av>=17.0.0",
    "debugpy>=1.8.20",
    "gdown>=5.2.1",
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.10.8",
    "natsort>=8.4.0",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.1",
    "pupil-apriltags>=1.0.4.post11",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "scipy>=1.17.1",
    "tomli>=1.2.0 ; python_full_version < '3.11'",
    "tomli-w>=1.2.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.setuptools.packages.find]
include = ["drosophila_model*"]
exclude = ["tests*", "models*", "logs*", "figures*", "math*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
