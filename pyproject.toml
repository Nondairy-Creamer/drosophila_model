[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectome-model"
version = "0.1.0"
description = "Drosophila connectome-based recurrent neural models."
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (setup.sh installs that file and
# then this package with --no-deps).
dependencies = [
    "h5py>=3.16.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",  # bundled ffmpeg: imageio mp4 writer, and matplotlib's ffmpeg fallback in fly_eye/hexagonal_animation.py
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",  # parquet engine for pandas
    "rdata>=1.1",  # reads the Reiser lab eye map (.RData) in build_column_geometry
    "scikit-learn>=1.8",
    "scipy>=1.17.1",
    "tomli-w>=1.2.0",
    "torch>=2.11.0",
    "unrar2-cffi>=0.5",  # reads the panorama .rar in process_raw_data (bundles UnRAR)
    # Tooling: pytest (tests/), debugpy (.vscode/launch.json attach config).
    "debugpy>=1.8.20",
    "pytest>=9.0.2",
]

[tool.setuptools.packages.find]
include = ["drosophila_model*"]
exclude = ["tests*", "models*", "logs*", "figures*", "math*"]

[tool.setuptools.package-data]
drosophila_model = ["config_default.toml", "config_default_data.toml", "data_handling/data_release_README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
