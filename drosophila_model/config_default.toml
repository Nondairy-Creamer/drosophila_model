# Per-user identity used by `register_git_on_server.py`. Leave blank in the
# default; users override in their local (gitignored) `config.toml`.
[user]
email = ''
name  = ''

[model]
# Default model: visual-system only, single right eye, current-based dynamics.
# This is a boilerplate that user configs override per-key. The [model.regions.*]
# sub-tables below cover only the regions defaulted here (optic_lobe). Configs
# that use other areas (e.g. antenna_lobe) supply their own region sub-table.
model_type = 'ConnectomeModel'
# CurrentDynamics | CurrentDivisiveDynamics | ConductanceDynamics |
# CellAnnDynamics | ArbitraryDynamics (see model_architecture.md).
dynamics_type = 'ConductanceDynamics'
# Depth of the per-neuron network (CellAnnDynamics only).
cell_ann_depth = 1
# Initial firing threshold of every cell type, in mV (ConductanceDynamics
# only). Neurons rest at the leak reversal potential, -50 mV, so a threshold
# below -50 gives them baseline firing at rest.
threshold_init = -50.0
# Multiplies every cell type's output strength after the spectral-norm
# rescale (set_sigma_max, target 0.95), at init only (ConductanceDynamics
# only). That rescale leaves each synaptic step passing on ~0.1-0.25 of its
# input; 3 makes every synapse start 3x stronger.
synapse_gain_init = 1.0
# CUDA devices fall back to 'cpu' (with a warning) when CUDA is unavailable.
device = "cuda:0"
dtype = "float32"
use_layer_norm = false
nonlinearity = "ReLU"
dt = 0.033333
# Minimum total synapses (summed over neuropils) for a neuron pair to be
# connected; applies to region membership and weights.
synapse_count_threshold = 2
use_connectome_subset = []

# Per-region option sub-tables. The set of region keys here drives which
# areas get loaded by `connectome_loading.load_connectome` and which
# RegionView subclasses get built (names must be in regions.REGION_REGISTRY).
# Each region owns its own `side` ('right' | 'left' | 'both'; defaults to the
# region class's own); all other keys are forwarded verbatim to that region's
# RegionView._load_extras (see regions.py). Each region also owns its own
# `readouts` / `readout_neurons` / regularizer params since their structure
# (e.g. column alignment) is region-specific. training.train builds optic-lobe-only
# models; antenna-lobe models are built by the olfactory analysis scripts.
[model.regions.optic_lobe]
# Only 'right' is supported: the baked column geometry/ids are right-eye only.
side                = 'right'
# Membership stringency. false (default): a neuron joins this region if it
# has >=1 above-threshold (synapse_count_threshold) connection in the
# region's neuropils. true: only neurons whose every above-threshold
# connection lies within the region (much more restrictive).
intrinsic           = false
use_input_conv      = true
conv_size_x         = 7
input_pre_conv_size = 5
num_temporal_modes  = 4
# FlowConv2DenomReadout (the same with a divisive denominator) left 2 of 5
# seeds stuck at flow_loss 1; FlowConv2Readout trained on every seed.
readouts            = ['FlowConv2Readout']
readout_neurons     = [
    'T1', 'T2', 'T2a', 'T3',
    'T4a', 'T4b', 'T4c', 'T4d',
    'T5a', 'T5b', 'T5c', 'T5d',
    'Tm1', 'Tm2', 'Tm3', 'Tm4',
    'Tm9', 'Tm16', 'Tm20', 'Tm28', 'Tm30',
]

[model.regions.optic_lobe.regularizer_parameters]
input_layer_l1 = 0.0

[training]
# Master seed for the run: seeds model parameter init, training noise, and
# DataLoader shuffling (all routed through the model's rng). launch_runs uses
# this as the base and assigns seed = base_seed + run_index per run;
# training.train uses it directly. Both are overridden by the --base-seed /
# --seed CLI flags. 7 reproduces the reference run trained on these defaults
# (base_fit_seed7).
base_seed = 7
# Passes over the training set (162 examples of the default datasets at
# batch_size 32 -> 5 optimizer steps per epoch). Expect the loss to sit at
# flow_loss ~1 / odometry_loss ~0.5 for the first ~5-45 epochs (seed
# dependent) before it starts to fall; it levels off by ~300.
num_epochs = 500
# Re-draw the training loss plot (models/<run>/figures/training/loss.png)
# every `save_every` epochs. Checkpoints are written whenever the loss improves.
save_every = 1
# Functions in training/loss_functions.py summed into the training loss:
# flow_loss, odometry_loss (two-eye datasets only), motion_mag.
loss_components = ['flow_loss', 'odometry_loss']
input_noise_std = 0.01
contrast_std = 0.2
luminance_std = 0.1
alpha = 0.01
clip_norm = 'none'
batch_size = 32

[stimulus]
# Which baked dataset(s) to train on (string or list). Stimulus *generation*
# parameters (stim_time, velocities, temporal_frequencies, ...) live in the
# data config: config_default_data.toml + config_data.toml, merged under
# config['data'] by drosophila_model.config.load_config().
stimulus_type = ['random_pano', 'counterphase_sine', 'full_field_step']

[data]
# Path to the data bundle (connectome_data/, stimulus/). Relative paths are
# resolved against the working directory (scripts run from the repo root), so
# the default is a folder next to the repo. Override it in your config.toml.
# Read it with config.get_data_folder(config).
data_folder = "../drosophila_model_data"
