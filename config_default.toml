[model]
# Anatomy (currently only 'ConnectomeModel'; regions are picked via `areas`).
model_type = 'ConnectomeModel'
# Dynamics mixin (class in dynamics_models.py)
dynamics_type = 'CurrentDynamics'
# Brain areas to load (must match the 'area' column in cell_info parquet).
areas = ['optic_lobe']
# Side filter for bilateral regions: 'right' | 'left' | 'both'.
side = 'right'
device = "cuda"
dtype = "float32"
use_layer_norm = false
nonlinearity = "Softplus"
readouts = ['FlowConv2Readout', 'L1Reg']
use_input_conv = true
dt = 0.01
synapse_count_threshold = 2
use_connectome_subset = []
readout_neurons = [
    'T1', 'T2', 'T2a', 'T3',
    'T4a', 'T4b', 'T4c', 'T4d',
    'T5a', 'T5b', 'T5c', 'T5d',
    'Tm1', 'Tm2', 'Tm3', 'Tm4',
    'Tm9', 'Tm16', 'Tm20', 'Tm28', 'Tm30',
]

[model.regularizer_parameters]
input_layer_l1 = 0.0

[training]
num_steps = 100000
save_every = 1
loss_components = ['flow_loss']
input_noise_std = 0.0
contrast_std = 0.0
luminance_std = 0.0
random_flip_input = false
alpha = 0.01
clip_norm = 1.0
use_synthetic_data = false
batch_size = 'none'

[stimulus]
stimulus_type = 'random_sine'
stim_time = 1.0
pre_stim_time = 0.0
post_stim_time = 0.0
seed = 0
velocity_amp = 100.0
velocity_time_scale = 0.5
num_repeats = 1
temporal_frequencies = [
    2,
    4,
    8,
]
# expanding_dot stimulus: trials per polarity (default 50 light + 50 dark)
expanding_dot_num_light = 50
expanding_dot_num_dark = 50
expanding_dot_filter_std = 2.5

[data]
connectome_folder = "../connectome_data"
# Eye coverage used by format_connectome_data.py when projecting hex columns
# onto the sphere (Lambert-azimuthal max angle = pi/2 * hemisphere_coverage).
hemisphere_coverage = 0.85
normalize_rows = false
synapse_count_threshold = 0
# Cell types removed by format_connectome_data.py before baking the bundle.
neurons_to_exclude = ['R1-6', 'R7', 'R8']
excitatory_nt = [
    "ACH",
]
inhibitory_nt = [
    "GABA",
    "GLUT",
]
root_id_dtype = "int64"
