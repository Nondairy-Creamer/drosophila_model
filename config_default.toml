[model]
device = "cuda"
dtype = "float32"
use_layer_norm = false
nonlinearity = "Softplus"
dt = 0.01

[training]
num_steps = 100000
save_every = 10
loss_fn = "cos_loss"
alpha = 0.01
clip_norm = 1.0
reset_init_every = 1
sigma_lambda = 0.0
peak_lambda = 0.0

[stimulus]
stim_time = 1.0
pre_stim_time = 0.0
post_stim_time = 0.0
tf_amp = 5.0
tf_time_scale = 0.15
num_repeats = 5
temporal_frequencies = [
    2,
    4,
    8,
]

[data]
connectome_folder = "../connectome_data"
fly_eye = "right"
use_intrinsic = false
hemisphere_coverage = 0.85
normalize_rows = false
synapse_count_threshold = 0
neurons_to_exclude = ['R1-6', 'R7', 'R8']
excitatory_nt = [
    "ACH",
]
inhibitory_nt = [
    "GABA",
    "GLUT",
]
synapse_count_dtype = "float64"
root_id_dtype = "int64"
