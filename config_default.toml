[model]
model_type = 'CurrentModel'
device = "cuda"
dtype = "float32"
use_layer_norm = false
nonlinearity = "Softplus"
use_decoder = false
use_input_conv = false
dt = 0.01
synapse_count_threshold = 2
use_connectome_subset = []

[training]
num_steps = 100000
save_every = 10
loss_fn = "cos_loss"
input_noise_std = 0.0
contrast_std = 0.0
luminance_std = 0.0
random_flip_input = false
alpha = 0.01
clip_norm = 1.0
reset_init_every = 1
sigma_lambda = 0.0
peak_lambda = 0.0
l1_lambda = 0.0
use_synthetic_data = false
batch_size = 'none'

[stimulus]
stimulus_type = 'random_sine'
stim_time = 1.0
pre_stim_time = 0.0
post_stim_time = 0.0
seed = 0
velocity_amp = 150.0
velocity_time_scale = 0.2
num_repeats = 5
temporal_frequencies = [
    2,
    4,
    8,
]

[data]
connectome_folder = "../connectome_data"
fly_eye = "right"
use_intrinsic = false
hemisphere_coverage = 0.85
normalize_rows = false
synapse_count_threshold = 0
neurons_to_exclude = ['R1-6', 'R7', 'R8']
excitatory_nt = [
    "ACH",
]
inhibitory_nt = [
    "GABA",
    "GLUT",
]
root_id_dtype = "int64"
